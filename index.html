<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Service / Product QA Checker — Ring Ring Marketing</title>
<style>
  :root {
    --bg:#f4f6f8; --card:#fff; --ink:#1f2933; --muted:#6b7280;
    --line:#e2e8f0; --brand:#2563eb;
    --err-bg:#fdecea; --err:#b42318; --warn-bg:#fef6e7; --warn:#92600a;
    --ok-bg:#e7f6ec; --ok:#1a7f3c;
  }
  *{box-sizing:border-box;}
  body{margin:0;font:15px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);}
  header{background:#fff;border-bottom:1px solid var(--line);padding:18px 24px;}
  header h1{margin:0;font-size:19px;}
  header p{margin:4px 0 0;color:var(--muted);font-size:13px;}
  main{max-width:1100px;margin:24px auto;padding:0 20px;display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;}
  .card h2{margin:0 0 12px;font-size:15px;}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.03em;}
  input[type=text],select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:14px;background:#fff;}
  textarea{width:100%;min-height:360px;padding:10px;border:1px solid var(--line);border-radius:6px;font:13px/1.45 ui-monospace,Consolas,monospace;resize:vertical;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  button{margin-top:14px;width:100%;padding:11px;background:var(--brand);color:#fff;border:0;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer;}
  button:hover{background:#1d4ed8;}
  .mode{font-size:12px;color:var(--muted);margin:6px 0 0;}
  .summary{font-size:13px;margin:0 0 12px;padding:8px 12px;border-radius:6px;background:#f1f5f9;}
  .check{border:1px solid var(--line);border-radius:8px;margin-bottom:14px;overflow:hidden;}
  .check>.head{padding:10px 14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;}
  .check.pass>.head{background:var(--ok-bg);color:var(--ok);}
  .check.warn>.head{background:var(--warn-bg);color:var(--warn);}
  .check.err>.head{background:var(--err-bg);color:var(--err);}
  .check .body{padding:10px 14px;font-size:13.5px;}
  .badge{font-size:11px;padding:2px 8px;border-radius:20px;background:rgba(0,0,0,.06);}
  .finding{padding:7px 0;border-top:1px dashed var(--line);}
  .finding:first-child{border-top:0;}
  .finding.error{color:var(--err);}
  .finding.warning{color:var(--warn);}
  .finding.ok{color:var(--ok);}
  .snippet{display:block;margin-top:3px;padding:5px 8px;background:#f8fafc;border-left:3px solid var(--line);color:var(--ink);font:12px ui-monospace,monospace;white-space:pre-wrap;}
  .fix{display:block;margin-top:6px;padding:6px 10px;background:#eef2ff;border-left:3px solid var(--brand);color:#1e3a8a;font-size:12.5px;border-radius:0 4px 4px 0;}
  .empty{color:var(--muted);padding:40px 0;text-align:center;}
  @media (max-width:880px){main{grid-template-columns:1fr;}}
</style>
</head>
<body>
<header>
  <h1>Service / Product QA Checker</h1>
  <p>Paste a generated Service or Product page draft and pick the shape (Hub or Individual). Flags what needs fixing before it ships. Runs entirely in your browser — nothing is uploaded.</p>
</header>
<main>
  <section class="card">
    <h2>Input</h2>
    <label for="pageType">Page type</label>
    <select id="pageType"><option value="SERVICE_HUB" selected>Service Hub</option><option value="PRODUCT_HUB">Product Hub</option><option value="SERVICE_INDIVIDUAL">Service Individual</option><option value="PRODUCT_INDIVIDUAL">Product Individual</option></select>
    <div class="row2">
      <div>
        <label for="keyword">Target keyword (exact match)</label>
        <input type="text" id="keyword" placeholder="e.g. replacement windows" />
      </div>
      <div>
        <label for="county">County / region (optional)</label>
        <input type="text" id="county" placeholder="e.g. St. Louis County" />
      </div>
    </div>
    <label for="cities">Cities to flag — comma separated (enables the city-free check)</label>
    <input type="text" id="cities" placeholder="e.g. Leesburg, The Villages, Ocala" />
    <label for="business">Business name (full)</label>
    <input type="text" id="business" placeholder="e.g. Howe-Peterson Funeral Home & Cremation Services" />
    <label for="file">Load a file (.docx or .txt) — or paste below</label>
    <input type="file" id="file" accept=".docx,.txt,.md" />
    <p class="mode" id="fileStatus"></p>
    <label for="content">Pasted page draft (the build-spec output)</label>
    <textarea id="content" placeholder="Paste the generated draft here (section-tagged [HERO]...[/HERO] format preferred)..."></textarea>
    <p class="mode" id="mode"></p>
    <button id="run">Run QA Check</button>
  </section>
  <section class="card">
    <h2>Results</h2>
    <div id="results"><div class="empty">Paste content and click "Run QA Check".</div></div>
  </section>
</main>
<script>
"use strict";

// ---- page-type config (full set; the dropdown limits what this file exposes) ----
const CONFIG = {
  HOMEPAGE:{label:"Homepage",titleMin:55,titleMax:70,long:true,descMin:140,descMax:160,nameInTitle:true,nameInDesc:false,kind:"homepage",
    expect:["HERO","EEAT_BLOCK","TRUST_BAR","SERVICES_HUB","WHY_CHOOSE_US","REVIEWS","OFFICE_MAP","FAQ","CLOSING_CTA"]},
  SERVICE_HUB:{label:"Service Hub",titleMin:55,titleMax:58,descMin:140,descMax:160,nameInTitle:false,nameInDesc:true,kind:"hub",
    expect:["META","HERO","TRUST_BAR","SERVICE_OVERVIEW","WHY_CHOOSE_US","MID_CTA","SOCIAL_PROOF","PROCESS","FINAL_CTA","FAQ","IMAGES"]},
  PRODUCT_HUB:{label:"Product Hub",titleMin:55,titleMax:58,descMin:140,descMax:160,nameInTitle:false,nameInDesc:true,kind:"hub",
    expect:["META","HERO","TRUST_BAR","SERVICE_OVERVIEW","WHY_CHOOSE_US","MID_CTA","SOCIAL_PROOF","PROCESS","FINAL_CTA","FAQ","IMAGES"]},
  SERVICE_INDIVIDUAL:{label:"Service Individual",titleMin:55,titleMax:58,descMin:140,descMax:160,nameInTitle:false,nameInDesc:true,kind:"individual",
    expect:["META","HERO","INTRO","OPTIONS","TESTIMONIAL","BENEFITS","COST_FACTORS","PROCESS","CLOSING_CTA","FAQ","SIBLINGS","IMAGES"]},
  PRODUCT_INDIVIDUAL:{label:"Product Individual",titleMin:55,titleMax:58,descMin:140,descMax:160,nameInTitle:false,nameInDesc:true,kind:"individual",
    expect:["META","HERO","INTRO","OPTIONS","TESTIMONIAL","BENEFITS","COST_FACTORS","PROCESS","CLOSING_CTA","FAQ","SIBLINGS","IMAGES"]},
  ABOUT_US:{label:"About Us",titleMin:55,titleMax:58,descMin:145,descMax:160,nameInTitle:true,nameInDesc:null,kind:"about",
    expect:["HERO","STATS_STRIP","OUR_STORY","DIFFERENTIATORS","REVIEWS","CTA_SECTION","SERVICE_AREA_NAP","IMAGES"]},
};

const PHONE_RE=/(\(?\d{3}\)?[\s.\-]?\d{3}[\s.\-]?\d{4})/;
const PHONE_G=new RegExp(PHONE_RE.source,"g");
const LINK_G=/\[([^\]]+)\]\(([^)]+)\)/g;
const GENERIC_ANCHORS=["learn more","click here","read more","here","this page","find out more","see more","more info","our page"];
const BUZZWORDS=["embark","uncover","unveil","transform","revolutionize"];

function countOccurrences(text,term){
  if(!term||!term.trim())return 0;
  const t=(text||"").toLowerCase(),k=term.toLowerCase();let c=0,p=0;
  while((p=t.indexOf(k,p))!==-1){c++;p+=k.length;}return c;
}
function escapeHtml(s){return(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function snippetsAround(text,regex,maxShow){
  const out=[];const re=new RegExp(regex.source,regex.flags.includes("g")?regex.flags:regex.flags+"g");let m;
  while((m=re.exec(text))!==null){
    const s=Math.max(0,m.index-30),e=Math.min(text.length,m.index+m[0].length+30);
    out.push("…"+text.slice(s,e).replace(/\s+/g," ").trim()+"…");
    if(out.length>=(maxShow||10))break;if(m.index===re.lastIndex)re.lastIndex++;
  }return out;
}
function stripNoise(text){
  let t=text;
  t=t.replace(/<script[\s\S]*?<\/script>/gi," ");
  t=t.replace(/\[SCHEMA\][\s\S]*?\[\/SCHEMA\]/gi," ");
  t=t.replace(/\[IMAGES\][\s\S]*?\[\/IMAGES\]/gi," ");
  t=t.replace(/<Image Alt>[\s\S]*?<\/Image Alt>/gi," ");
  t=t.replace(/^\s*(PLACEMENT|TYPE|ALT|FILENAME|ORIGIN|AI_STATUS|HERO_IMAGE|Image Download|Image Alt)\s*:.*$/gim," ");
  return t;
}
function parseSections(text){
  const sections={};const re=/\[([A-Z_0-9]+)\]([\s\S]*?)\[\/\1\]/g;let m;
  while((m=re.exec(text))!==null)sections[m[1]]=(sections[m[1]]?sections[m[1]]+"\n":"")+m[2].trim();
  return sections;
}
function findMeta(text,sections,field){
  const tag=field==="title"?"META_TITLE":"META_DESCRIPTION";
  if(sections.META){const m=sections.META.match(new RegExp("^"+tag+":\\s*(.+)$","m"));if(m)return m[1].trim();}
  const lbl=field==="title"?"Meta\\s*Title":"Meta\\s*Desc(?:ription)?";
  const m=text.match(new RegExp("^\\s*"+lbl+":\\s*(.+)$","mi"));return m?m[1].trim():"";
}
// business-name presence: full name, or its longest distinctive word
function nameWords(bn){return (bn||"").split(/\s+/).filter(w=>w.length>2 && !/^(llc|inc|inc\.|the|and|of|&|co|co\.|ltd)$/i.test(w));}
function hasName(text,bn){
  if(!bn||!bn.trim())return false;
  if(countOccurrences(text,bn)>0)return true;
  const ws=nameWords(bn);if(!ws.length)return false;
  const longest=ws.slice().sort((a,b)=>b.length-a.length)[0];
  return countOccurrences(text,longest)>0;
}
function allLinks(text){const out=[];let m;LINK_G.lastIndex=0;while((m=LINK_G.exec(text))!==null)out.push({anchor:m[1].trim(),url:m[2].trim(),raw:m[0]});return out;}

// ---- checks ----
function chkSections(clean,sections,cfg){
  const findings=[];let worst="pass";
  if(/\[SECTION\]/i.test(clean)){return{status:"err",findings:[{sev:"error",msg:"The draft uses literal [SECTION] tags instead of real named sections ([HERO], [FAQ], ...). Regenerate."}]};}
  const present=Object.keys(sections);
  if(!present.length){return{status:"warn",findings:[{sev:"warning",msg:"No [SECTION] tags detected — document/Word mode. Section-level checks are skipped; paste the section-tagged build spec for full analysis."}]};}
  cfg.expect.forEach(name=>{
    if(sections[name])findings.push({sev:"ok",msg:`[${name}] present.`});
    else{findings.push({sev:"warning",msg:`Expected section [${name}] not found.`,fix:`Add the [${name}] section, or confirm it was intentionally omitted (some sections are conditional).`});if(worst==="pass")worst="warn";}
  });
  return{status:worst,findings};
}

function chkMeta(clean,sections,cfg,business){
  const title=findMeta(clean,sections,"title"),desc=findMeta(clean,sections,"description");
  const findings=[];let worst="pass";
  if(!title)findings.push({sev:"warning",msg:"No Meta Title detected."});
  else{
    const n=title.length;
    if(n<cfg.titleMin||n>cfg.titleMax){findings.push({sev:"warning",msg:`Meta Title is ${n} chars (target ${cfg.titleMin}-${cfg.titleMax}${cfg.long?"; homepage may run longer to fit the name + city":""}).`,fix:"Tighten or expand to the target band."});if(worst==="pass")worst="warn";}
    else findings.push({sev:"ok",msg:`Meta Title length OK (${n} chars).`});
    if(/\|/.test(title)){findings.push({sev:"warning",msg:"Meta Title uses a pipe ( | ) separator — use a hyphen ( - )."});if(worst==="pass")worst="warn";}
    const inT=hasName(title,business);
    if(business.trim()){
      if(cfg.nameInTitle===true&&!inT){findings.push({sev:"warning",msg:"Title should LEAD with the business name (homepage/About Us convention) — name not detected.",fix:`Start the title with "${business}".`});if(worst==="pass")worst="warn";}
      if(cfg.nameInTitle===false&&inT){findings.push({sev:"warning",msg:"Business name is in the Title — service/product titles carry NO business name (it belongs in the description).",fix:"Remove the business name from the title."});if(worst==="pass")worst="warn";}
    }
  }
  if(!desc)findings.push({sev:"warning",msg:"No Meta Description detected."});
  else{
    const n=desc.length;
    if(n<cfg.descMin||n>cfg.descMax){findings.push({sev:"warning",msg:`Meta Description is ${n} chars (target ${cfg.descMin}-${cfg.descMax}).`});if(worst==="pass")worst="warn";}
    else findings.push({sev:"ok",msg:`Meta Description length OK (${n} chars).`});
    if(PHONE_RE.test(desc)){findings.push({sev:"error",msg:"Meta Description contains a phone number — never put the phone in meta."});worst="err";}
    if(business.trim()&&cfg.nameInDesc!==null){
      const inD=hasName(desc,business);
      if(cfg.nameInDesc===true&&!inD){findings.push({sev:"warning",msg:"Description should contain the business name (service/product convention) — not detected."});if(worst==="pass")worst="warn";}
      if(cfg.nameInDesc===false&&inD){findings.push({sev:"warning",msg:"Description contains the business name — on the homepage the name lives in the TITLE, not the description.",fix:"Remove the business name from the description."});if(worst==="pass")worst="warn";}
    }
  }
  return{status:worst,findings};
}

function chkKeyword(clean,sections,cfg,keyword){
  if(!keyword.trim())return{status:"warn",findings:[{sev:"warning",msg:"No target keyword entered — skipped."}]};
  const title=findMeta(clean,sections,"title");
  const findings=[];const total=countOccurrences(clean,keyword),inT=countOccurrences(title,keyword),outside=total-inT;
  if(inT===0)findings.push({sev:"warning",msg:"Exact keyword NOT found in the Meta Title — it must appear there.",fix:"Put the exact keyword phrase in the Meta Title verbatim."});
  else findings.push({sev:"ok",msg:"Exact keyword present in the Meta Title."});
  if(outside>0){
    const snips=snippetsAround(clean.replace(title," "),new RegExp(keyword.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i"),8);
    findings.push({sev:"error",msg:`Exact keyword appears ${outside} time(s) OUTSIDE the Meta Title. Use it only in the title; everywhere else use natural variations.`,detail:snips.join("\n"),fix:"Replace each exact-match instance with a natural variation."});
  }else findings.push({sev:"ok",msg:"Exact keyword does not appear outside the Meta Title."});
  return{status:outside>0?"err":(inT===0?"warn":"pass"),findings};
}

function chkCityFree(clean,sections,cfg,cities){
  if(!cities.trim())return{status:"warn",findings:[{sev:"warning",msg:"No city/cities entered — city-free check skipped. (Enter the client's target cities, comma-separated.)"}]};
  // exclude geo-bridge / locations sections and all link anchors+urls (city pages are linked there on purpose)
  let body=clean
    .replace(/\[SERVICE_AREAS\][\s\S]*?\[\/SERVICE_AREAS\]/gi," ")
    .replace(/\[SERVICE_AREA_NAP\][\s\S]*?\[\/SERVICE_AREA_NAP\]/gi," ")
    .replace(/\[OFFICE_MAP\][\s\S]*?\[\/OFFICE_MAP\]/gi," ")
    .replace(/\[LOCATIONS?\][\s\S]*?\[\/LOCATIONS?\]/gi," ")
    .replace(/\[Q_AREAS\][\s\S]*?\[\/Q_AREAS\]/gi," ")
    .replace(LINK_G," ")                                   // city-page links are the allowed geo bridge
    .replace(/^\s*(URL|PAGE_URL|MAP_CUE|OFFICE_ADDRESS|ADDRESS|DEV_NOTE)\s*:.*$/gim," ");
  // homepage/about may carry ONE broad geo in the H1/hero — drop the hero H1 line + an "areas served" FAQ question
  if(cfg.kind==="homepage"||cfg.kind==="about"){
    body=body.replace(/^\s*H1\s*:.*$/gim," ").replace(/<h1>[\s\S]*?<\/h1>/gi," ");
  }
  body=body.replace(/what areas (do|does) .*serve\??/gi," ");
  const findings=[];let worst="pass";
  cities.split(",").map(c=>c.trim()).filter(Boolean).forEach(city=>{
    const c=countOccurrences(body,city);
    if(c>0){findings.push({sev:"error",msg:`City "${city}" appears ${c} time(s) in body content — key pages must stay city-free (county only; city names belong to the city-page tool and to the geo-bridge LINKS).`,detail:snippetsAround(body,new RegExp(city.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"i"),6).join("\n"),fix:"Remove the city from the body, or (if it is a service-area link) make sure it lives inside the geo-bridge link list, not loose prose."});worst="err";}
    else findings.push({sev:"ok",msg:`City "${city}" not found in body content (correct).`});
  });
  return{status:worst,findings};
}

function chkCounty(clean,cfg,county){
  if(!county.trim())return null;
  const c=countOccurrences(clean.replace(LINK_G," "),county);
  if(c>2)return{status:"warn",findings:[{sev:"warning",msg:`County "${county}" mentioned ${c} times (max 2 — it is the only allowed geo trust signal, in the hero subheadline or closing).`,fix:"Trim to 1-2 mentions."}]};
  return{status:"pass",findings:[{sev:"ok",msg:`County "${county}" mentioned ${c} time(s) (within the 1-2 cap).`}]};
}

function chkEmDash(clean){
  const em=snippetsAround(clean,/—/,12),en=snippetsAround(clean,/–/,12);const findings=[];
  if(em.length)findings.push({sev:"error",msg:`Found ${em.length}${em.length>=12?"+":""} em-dash(es) (—).`,detail:em.join("\n"),fix:"Replace each — with a comma or a hyphen."});
  if(en.length)findings.push({sev:"warning",msg:`Found ${en.length}${en.length>=12?"+":""} en-dash(es) (–).`,detail:en.join("\n"),fix:"Replace each – with a hyphen or comma."});
  if(!em.length&&!en.length)findings.push({sev:"ok",msg:"No em-dashes or en-dashes."});
  return{status:em.length?"err":en.length?"warn":"pass",findings};
}

function chkForbidden(clean){
  const findings=[];let worst="pass";
  const dollars=snippetsAround(clean,/\$\s?\d/,10);
  if(dollars.length){findings.push({sev:"error",msg:`Found ${dollars.length} dollar amount(s) — use evergreen phrasing, no exact prices.`,detail:dollars.join("\n")});worst="err";}
  else findings.push({sev:"ok",msg:"No dollar amounts."});
  const years=snippetsAround(clean,/\b20(2[0-9])\b/,10);
  if(years.length){findings.push({sev:"warning",msg:`Found ${years.length} recent-year reference(s) (2020s) — no current/recent-year refs in body (founding years are fine; prefer duration phrasing).`,detail:years.join("\n")});if(worst==="pass")worst="warn";}
  const buzz=[];BUZZWORDS.forEach(b=>{if(new RegExp("\\b"+b,"i").test(clean))buzz.push(b);});
  if(buzz.length){findings.push({sev:"warning",msg:`Buzzword(s) found: ${buzz.join(", ")}.`,fix:"Swap for plain, concrete language."});if(worst==="pass")worst="warn";}
  if(!dollars.length&&!years.length&&!buzz.length)findings.push({sev:"ok",msg:"No dollar amounts, recent-year refs, or buzzwords."});
  return{status:worst,findings};
}

function chkPhone(clean,sections){
  // phone allowed on CALL/CTA/PHONE/tap-to-call lines; flag everywhere else
  const findings=[];const lines=clean.split("\n");const bad=[];
  for(const line of lines){
    if(!PHONE_RE.test(line))continue;
    if(/FORM_CTA/i.test(line)){bad.push("FORM_CTA must not contain a phone: "+line.trim().slice(0,70));continue;}
    if(/(CALL_CTA|CTA_BUTTON|^\s*PHONE\s*:|tap[\s_-]?to[\s_-]?call|tel:|call\b)/i.test(line))continue;
    bad.push(line.trim().slice(0,80));
  }
  if(bad.length)return{status:"err",findings:[{sev:"error",msg:`Phone number found OUTSIDE a Call-CTA in ${bad.length} place(s) — phone lives only in Call-CTA elements (and chrome: sticky bar/footer).`,detail:bad.slice(0,10).join("\n"),fix:"Move each phone into a Call CTA; remove it from body, FORM_CTA, descriptions, and FAQ answers."}]};
  return{status:"pass",findings:[{sev:"ok",msg:"No phone numbers outside Call-CTA elements."}]};
}

function chkBusinessTrunc(clean,business){
  if(!business.trim())return{status:"warn",findings:[{sev:"warning",msg:"No business name entered — truncation check skipped."}]};
  const ws=business.split(/\s+/).filter(Boolean);
  if(ws.length<2)return{status:"pass",findings:[{sev:"ok",msg:"Single-word business name — truncation check not applicable."}]};
  const first=ws[0];
  if(/^(the|a|an)$/i.test(first))return{status:"pass",findings:[{sev:"ok",msg:"Business name truncation check skipped (leading article)."}]};
  // first word used alone = not immediately followed by the 2nd name word
  const re=new RegExp("\\b"+first.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b(?!\\s+"+ws[1].replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
  const lone=(clean.match(re)||[]).length;
  const full=countOccurrences(clean,business)+countOccurrences(clean,ws.slice(0,2).join(" "));
  if(lone>0&&lone>full)return{status:"warn",findings:[{sev:"warning",msg:`The brand may be shortened to "${first}" alone (${lone} bare use(s) vs ${full} full) — always use the full name "${business}" where the brand is named (a trailing LLC/Inc. may be dropped).`,fix:`Expand bare "${first}" references to the full business name.`}]};
  return{status:"pass",findings:[{sev:"ok",msg:"Business name used in full (no bare-first-word truncation detected)."}]};
}

function chkAnchors(clean){
  const links=allLinks(clean);
  if(!links.length)return{status:"warn",findings:[{sev:"warning",msg:"No [anchor](url) links detected. If this page has a services list, siblings, or a geo bridge, those URLs must render as real links."}]};
  const findings=[];let worst="pass";let clean_count=0;
  links.forEach(l=>{
    const a=l.anchor.replace(/\*\*/g,"").trim();const words=a.split(/\s+/).filter(Boolean).length;const issues=[];
    if(GENERIC_ANCHORS.includes(a.toLowerCase())){issues.push("generic anchor");}
    if(/\bpage\b/i.test(a)){issues.push('contains the word "page"');}
    if(words>9||/[.!?]/.test(a)){issues.push("sentence/description-shaped (link a 2-6 word name only)");}
    if(issues.length){const hard=issues.some(x=>x!=="");findings.push({sev:"error",msg:`Anchor "${a.slice(0,60)}" — ${issues.join("; ")}.`,fix:"Anchor a 2-6 word natural variation of the linked page's name; let the sentence carry the context."});worst="err";}
    else if(words===7||words===8||words===9){findings.push({sev:"warning",msg:`Anchor "${a}" is ${words} words — keep anchors to 2-6 words.`});if(worst==="pass")worst="warn";}
    else clean_count++;
  });
  if(clean_count===links.length)findings.unshift({sev:"ok",msg:`All ${links.length} link anchor(s) look clean (2-6 word name variations).`});
  else findings.unshift({sev:worst==="err"?"error":"warning",msg:`${links.length} link(s) checked — ${links.length-clean_count} need attention.`});
  return{status:worst,findings};
}

function faqQuestions(sections){
  let faq=sections.FAQ||"";
  // include a trailing Q_AREAS item if separated
  if(sections.Q_AREAS)faq+="\nQ: What areas do you serve?";
  if(!faq)return null;
  const qs=(faq.match(/^\s*(Q:|H3:|<h3>)/gim)||[]).length;
  return qs;
}

function chkStructural(clean,sections,cfg,cities){
  const findings=[];let worst="pass";
  const add=(sev,msg,fix)=>{findings.push(fix?{sev,msg,fix}:{sev,msg});if(sev==="error")worst="err";else if(sev==="warning"&&worst!=="err")worst="warn";};
  const has=n=>!!sections[n];
  const linksIn=n=>sections[n]?allLinks(sections[n]).length:0;
  const geoBridgePlainText=()=>{
    // a section that lists cities but renders them without links
    const src=sections.SERVICE_AREAS||sections.SERVICE_AREA_NAP||sections.Q_AREAS||(sections.FAQ&&/areas (do|does).*serve/i.test(sections.FAQ)?sections.FAQ:"")||"";
    if(!src)return false;
    if(!cities.trim())return false;
    const anyCity=cities.split(",").map(c=>c.trim()).filter(Boolean).some(c=>countOccurrences(src,c)>0);
    return anyCity && allLinks(src).length===0;
  };

  if(cfg.kind==="homepage"){
    const h1=(clean.match(/^\s*H1\s*:/gim)||[]).length + (clean.match(/<h1>/gi)||[]).length;
    if(h1>1)add("warning",`${h1} H1s detected — a page has exactly one H1 (it lives in the HERO; the [META] block must not repeat it).`);
    else add("ok","Single H1 (correct).");
    if(/\[SCHEMA\]/i.test(clean))add("warning","A [SCHEMA] block is in the draft — schema is produced by the Schema Generator tool, not the page draft. Remove it.");
    if(/\[NAV\]/i.test(clean))add("warning","A [NAV] block is in the draft — the nav is rendered in the mockup only, never in the content draft.");
    if(has("EEAT_BLOCK")){
      if(/\bsince\s+\d{4}\b|\bover\s+(a|one|two|three|four|five|\d+)\s+(decade|year)|more than\s+\d+\s+year|founded\s+in\s+\d{4}|established\s+\d{4}/i.test(sections.EEAT_BLOCK))add("ok","EEAT block states longevity.");
      else add("warning","EEAT block may be missing the mandatory LONGEVITY signal — state how long the business has operated (founding year if known, else a rounded duration).");
      const rl=allLinks(sections.EEAT_BLOCK).length;
      if(rl>1)add("warning",`EEAT paragraph has ${rl} links — weave exactly ONE resource link.`);
    }
    if(has("SERVICES_HUB")){
      const items=(sections.SERVICES_HUB.match(/^\s*[-*]/gm)||[]).length;
      if(items>0&&linksIn("SERVICES_HUB")===0)add("error","Services Hub lists items but renders NO links — every service that has a URL must be a real [anchor](url). (If none of the services have URLs yet, expect [NEEDS CLIENT INPUT: URL] flags instead.)");
      else if(linksIn("SERVICES_HUB")>0)add("ok","Services Hub renders structural links.");
    }
    const hasAreas=has("SERVICE_AREAS");
    const faqAreas=sections.FAQ&&/areas (do|does).*serve/i.test(sections.FAQ);
    if(hasAreas&&faqAreas)add("warning","Both a [SERVICE_AREAS] section AND an areas-served FAQ exist — drop one. Single-location: keep Service Areas, no areas FAQ. Multi-location: drop Service Areas, keep the [Q_AREAS] FAQ item.");
    if(geoBridgePlainText())add("error","The service-area cities are plain text — each must be a [keyword anchor](city page url) link (or a [NEEDS CLIENT INPUT: city page URL] flag).");
    const q=faqQuestions(sections);
    if(q!==null){if(q<4)add("warning",`FAQ has ${q} question(s) — homepage targets 5 brand/primary-service questions (floor 4).`);else add("ok",`FAQ has ${q} questions.`);}
  }

  if(cfg.kind==="hub"){
    ["CALL_CTA","FORM_CTA","PHONE"].forEach(f=>{if(sections.HERO&&!new RegExp(f).test(sections.HERO))add("warning",`Hero is missing a ${f} line.`);});
    if(has("SERVICE_OVERVIEW")){
      const h2=(sections.SERVICE_OVERVIEW.match(/^\s*H2:\s*(.+)$/mi)||[])[1]||"";
      if((h2.match(/,/g)||[]).length>=3)add("warning",`Service Overview H2 ("${h2.slice(0,60)}") lists 4+ options — name the CATEGORY instead; the individual options belong in the grid cards.`);
    }
    // order: FINAL_CTA must come before FAQ
    if(has("FINAL_CTA")&&has("FAQ")&&clean.indexOf("[FINAL_CTA]")>clean.indexOf("[FAQ]"))add("warning","FINAL_CTA appears AFTER the FAQ — the Final CTA is the last conversion push and belongs before the FAQ.");
    if(has("PROCESS")){const steps=(sections.PROCESS.match(/STEP_\d_TITLE/gi)||[]).length;if(steps&&steps!==3)add("warning",`Process has ${steps} steps — use exactly 3.`);}
    const q=faqQuestions(sections);
    if(q!==null){if(q<4)add("warning",`FAQ has ${q} question(s) — target 5 (floor 4): Q1-Q4 decision questions + Q5 areas geo bridge.`);else add("ok",`FAQ has ${q} questions.`);}
    if(geoBridgePlainText())add("error","The areas-served cities (Q5 geo bridge) are plain text — each must be a [keyword anchor](city page url) link.");
    if(has("MID_CTA")&&!/CTA_BUTTON|TEXT:/i.test(sections.MID_CTA))add("warning","MID_CTA should have a clickable form CTA button, not just a headline.");
  }

  if(cfg.kind==="individual"){
    if(has("OPTIONS")){if(!/CTA_BUTTON/i.test(sections.OPTIONS))add("error","The [OPTIONS] block must end with a clickable form CTA_BUTTON (no phone).");else add("ok","OPTIONS has a closing form CTA.");}
    if(has("INTRO")){const w=sections.INTRO.replace(/^\s*H\d:.*/gim,"").split(/\s+/).filter(Boolean).length;if(w>110)add("warning",`Intro is ~${w} words — keep it to about 100, opening with the buyer's situation, no specs.`);}
    if(has("SIBLINGS")){if(linksIn("SIBLINGS")===0)add("error","[SIBLINGS] renders no links — every provided sibling + the hub must be a real [anchor](url) link.");else{if(!/hub|all\s|explore|view all|back to/i.test(sections.SIBLINGS)&&linksIn("SIBLINGS")<2)add("warning","Confirm the SIBLINGS strip links back to the HUB page (required), not only siblings.");add("ok","Siblings strip renders links.");}}
    const q=faqQuestions(sections);
    if(q!==null){if(q<4)add("warning",`FAQ has ${q} item(s) — target 4 strict questions (floor 3) + the areas-served bridge = 5.`);else add("ok",`FAQ has ${q} items.`);}
    if(geoBridgePlainText())add("error","The areas-served cities are plain text — each must be a [keyword anchor](city page url) link.");
    // URL guard
    const url=(sections.META&&(sections.META.match(/^URL:\s*(.+)$/m)||[])[1])||"";
    if(url&&cities.trim()){cities.split(",").map(c=>c.trim()).filter(Boolean).forEach(c=>{if(new RegExp(c.replace(/\s+/g,"[-\\s]?"),"i").test(url))add("error",`The page URL slug contains the city "${c}" — key-page slugs must be city-free.`);});}
  }

  if(cfg.kind==="about"){
    const title=findMeta(clean,sections,"title");
    if(title&&!/\s-\s/.test(title))add("warning","About Us title should be 'Business Name - Descriptor' (hyphen separator).");
    if(has("OUR_STORY")){
      const w=sections.OUR_STORY.replace(/^\s*H\d:.*/gim,"").split(/\s+/).filter(Boolean).length;
      if(w<150||w>250)add("warning",`Our Story is ~${w} words — target 150-250 across 3 paragraphs (founding/philosophy/community).`);else add("ok",`Our Story length OK (~${w} words).`);
    }
    if(has("STATS_STRIP")){const n=(sections.STATS_STRIP.match(/^\s*[-*]/gm)||[]).length;if(n&&n!==4)add("warning",`Stats strip has ${n} stats — choose the 4 strongest.`);}
    if(has("DIFFERENTIATORS")){const n=(sections.DIFFERENTIATORS.match(/^\s*[-*]/gm)||[]).length;if(n&&(n<4||n>6))add("warning",`Differentiators: ${n} cards — use 4-6.`);}
    if(has("REVIEWS")){const stars=(sections.REVIEWS.match(/★|5[\s-]?star|⭐/gi)||[]).length;if(stars&&stars<3)add("warning","About Us should curate 3 reviews (by emotional criteria, not speed/price).");}
    if(geoBridgePlainText())add("error","The communities-served cities in SERVICE_AREA_NAP are plain text — each existing city page must be a linked anchor.");
  }

  if(!findings.length)return null;
  return{status:worst,findings};
}

// ---- .docx / .txt loading (no external lib) ----
function decodeXmlEntities(s){return s.replace(/&#x([0-9a-fA-F]+);/g,(_,h)=>String.fromCodePoint(parseInt(h,16))).replace(/&#(\d+);/g,(_,d)=>String.fromCodePoint(parseInt(d,10))).replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,"&");}
async function inflateRaw(bytes){const ds=new DecompressionStream("deflate-raw");const ab=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();return new Uint8Array(ab);}
async function docxEntryText(buf,name){
  const dv=new DataView(buf.buffer,buf.byteOffset,buf.byteLength);let eocd=-1;
  for(let i=buf.length-22;i>=0&&i>buf.length-65557;i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}}
  if(eocd<0)throw new Error("not a valid .docx (no ZIP directory)");
  let off=dv.getUint32(eocd+16,true);const count=dv.getUint16(eocd+10,true);
  for(let n=0;n<count;n++){
    if(dv.getUint32(off,true)!==0x02014b50)break;
    const method=dv.getUint16(off+10,true),compSize=dv.getUint32(off+20,true),nameLen=dv.getUint16(off+28,true),extraLen=dv.getUint16(off+30,true),commentLen=dv.getUint16(off+32,true),localOff=dv.getUint32(off+42,true);
    const fname=new TextDecoder().decode(buf.subarray(off+46,off+46+nameLen));
    if(fname===name){const lNameLen=dv.getUint16(localOff+26,true),lExtraLen=dv.getUint16(localOff+28,true);const dataStart=localOff+30+lNameLen+lExtraLen;const comp=buf.subarray(dataStart,dataStart+compSize);const raw=method===0?comp:await inflateRaw(comp);return new TextDecoder("utf-8").decode(raw);}
    off+=46+nameLen+extraLen+commentLen;
  }
  throw new Error(name+" not found in the .docx");
}
async function readDocxText(file){
  const buf=new Uint8Array(await file.arrayBuffer());const xml=await docxEntryText(buf,"word/document.xml");
  let t=xml.replace(/<\/w:p>/g,"\n").replace(/<w:br[^>]*\/>/g,"\n").replace(/<w:tab[^>]*\/>/g,"\t").replace(/<[^>]+>/g,"");
  return decodeXmlEntities(t).split("\n").map(l=>l.replace(/\s+$/,"")).filter(l=>l!=="").join("\n");
}

// ---- render + run ----
function renderCheck(title,result){
  const cls=result.status;const badge=cls==="pass"?"PASS":cls==="warn"?"REVIEW":"ISSUES";let body="";
  result.findings.forEach(f=>{body+=`<div class="finding ${f.sev}">${escapeHtml(f.msg)}`;if(f.detail)body+=`<span class="snippet">${escapeHtml(f.detail)}</span>`;if(f.html)body+=f.html;if(f.fix)body+=`<span class="fix"><b>Fix:</b> ${escapeHtml(f.fix)}</span>`;body+=`</div>`;});
  return `<div class="check ${cls}"><div class="head"><span>${title}</span><span class="badge">${badge}</span></div><div class="body">${body}</div></div>`;
}
function runQA(){
  const raw=document.getElementById("content").value;
  const cfg=CONFIG[document.getElementById("pageType").value];
  const keyword=document.getElementById("keyword").value;
  const cities=document.getElementById("cities").value;
  const county=document.getElementById("county").value;
  const business=document.getElementById("business").value;
  const out=document.getElementById("results");
  if(!raw.trim()){out.innerHTML=`<div class="empty">Paste some content first.</div>`;return;}
  const clean=stripNoise(raw);const sections=parseSections(clean);const structured=Object.keys(sections).length>0;
  document.getElementById("mode").textContent=structured?`Detected section-tagged build spec — full ${cfg.label} analysis. Schema + image details excluded.`:"Document mode (no [SECTION] tags) — paste the section-tagged build spec for full structural analysis.";
  let results=[
    ["1 · Sections present",chkSections(clean,sections,cfg)],
    ["2 · Meta tags",chkMeta(clean,sections,cfg,business)],
    ["3 · Exact-match keyword (Meta Title only)",chkKeyword(clean,sections,cfg,keyword)],
    ["4 · City-free content",chkCityFree(clean,sections,cfg,cities)],
  ];
  const cty=chkCounty(clean,cfg,county);if(cty)results.push(["5 · County cap (geo trust signal)",cty]);
  results.push(["6 · Em-dashes",chkEmDash(clean)]);
  results.push(["7 · Dollar amounts, recent years, buzzwords",chkForbidden(clean)]);
  results.push(["8 · Phone (Call-CTA only)",chkPhone(clean,sections)]);
  results.push(["9 · Business name in full",chkBusinessTrunc(clean,business)]);
  results.push(["10 · Anchor-text discipline",chkAnchors(clean)]);
  const st=chkStructural(clean,sections,cfg,cities);if(st)results.push([`11 · ${cfg.label} structure`,st]);
  const errs=results.filter(r=>r[1].status==="err").length,warns=results.filter(r=>r[1].status==="warn").length;
  out.innerHTML=`<div class="summary"><b>${errs}</b> with issues, <b>${warns}</b> to review, <b>${results.length-errs-warns}</b> passing.</div>`+results.map(r=>renderCheck(r[0],r[1])).join("");
}
document.getElementById("run").addEventListener("click",runQA);
document.getElementById("pageType").addEventListener("change",()=>{if(document.getElementById("content").value.trim())runQA();});
document.getElementById("file").addEventListener("change",async e=>{
  const file=e.target.files[0];if(!file)return;const status=document.getElementById("fileStatus");status.textContent="Reading "+file.name+"…";
  try{const text=/\.docx$/i.test(file.name)?await readDocxText(file):await file.text();document.getElementById("content").value=text;status.textContent="Loaded "+file.name+" ("+text.length+" chars) — running check…";runQA();}
  catch(err){status.textContent="Could not read "+file.name+": "+err.message+". Try pasting the text instead.";}
});
</script>
